name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-24.04

        permissions:
            contents: write
            id-token: write
            attestations: write
            artifact-metadata: write

        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Verify release version
              run: |
                  manifest_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("manifest.json", "utf8")).version')"
                  package_version="$(node -p 'require("./package.json").version')"
                  minimum_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("versions.json", "utf8"))[process.env.GITHUB_REF_NAME] ?? ""')"
                  min_app_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("manifest.json", "utf8")).minAppVersion')"

                  test "$GITHUB_REF_NAME" = "$manifest_version"
                  test "$GITHUB_REF_NAME" = "$package_version"
                  test "$minimum_version" = "$min_app_version"

            - name: Install dependencies
              run: npm ci

            - name: Build plugin
              run: npm run build

            - name: Verify build files
              run: |
                  for file in \
                    main.js \
                    manifest.json \
                    styles.css \
                    LICENSE
                  do
                    test -f "build/akki-obsidian/$file" || {
                      echo "Missing build file: $file"
                      exit 1
                    }
                  done

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      build/akki-obsidian/main.js
                      build/akki-obsidian/manifest.json
                      build/akki-obsidian/styles.css
                      build/akki-obsidian/LICENSE

            - name: Create release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --verify-tag \
                    --title="$tag" \
                    --generate-notes \
                    "build/akki-obsidian/main.js" \
                    "build/akki-obsidian/manifest.json" \
                    "build/akki-obsidian/styles.css" \
                    "build/akki-obsidian/LICENSE"
